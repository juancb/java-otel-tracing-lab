# log4j2 config for HBase 2.5+ daemons.
#
# HBASE-26802 migrated HBase from log4j 1.x to log4j2; the 2.5.x distribution
# already ships the log4j2 jars in lib/client-facing-thirdparty/. We point
# HBase at this file via -Dlog4j2.configurationFile in the HBase *_OPTS env
# vars (see ../entrypoint.sh).
#
# Why log4j2 matters here: the OpenTelemetry Java agent's log4j-mdc-1.0
# instrumentation only hooks log4j 2.x. With log4j 1.x (reload4j), the
# %X{trace_id} layout token always renders empty because nothing populates
# the MDC. Once log4j2 is active, the agent injects trace_id / span_id /
# trace_flags into the MDC for any log call that happens inside an active
# span — so HBase RegionServer log lines that are emitted while handling a
# client RPC will be tagged with the same trace ID Tempo sees.
#
# Hadoop daemons (NameNode, DataNode) stay on log4j 1.x via the existing
# log4j.properties. Their log lines won't carry trace IDs; that's fine for
# this lab since the interesting client-RPC spans live in HBase.

status = warn
name = HBaseLog4j2

# --- Console appender ------------------------------------------------------
appender.console.type   = Console
appender.console.name   = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type    = PatternLayout
# %X{trace_id} / %X{span_id} are populated by the OTel agent inside spans.
# Outside a span the ThreadContextMap entry is missing and the token renders
# as empty (no `:-` default-value syntax in log4j2 — empty is fine).
appender.console.layout.pattern = %d{HH:mm:ss} %-5p [%c{1}] traceId=%X{trace_id} spanId=%X{span_id} %m%n

# --- Root --------------------------------------------------------------------
rootLogger.level                  = info
rootLogger.appenderRef.console.ref = console

# --- Quiet down noisier subsystems ------------------------------------------
logger.zk.name              = org.apache.zookeeper
logger.zk.level             = warn

logger.hbasezk.name         = org.apache.hadoop.hbase.zookeeper
logger.hbasezk.level        = warn

logger.metrics.name         = org.apache.hadoop.metrics2
logger.metrics.level        = warn

logger.hdfs.name            = org.apache.hadoop.hdfs
logger.hdfs.level           = info

logger.ipc.name             = org.apache.hadoop.ipc
logger.ipc.level            = info

logger.otel.name            = io.opentelemetry
logger.otel.level           = info
