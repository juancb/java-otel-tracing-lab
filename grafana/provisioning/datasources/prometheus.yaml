# Provisions the Prometheus datasource for Stage A.
#
# Prometheus stores:
#   - Tempo's service-graph + span-metrics (RED) data
#   - Every metric the OTel Java agents emit (heap, GC, kafka.client.*, ...)
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      # When Prometheus stores exemplars (trace_id labels on histogram samples),
      # Grafana renders clickable dots on time-series panels that jump to Tempo.
      # Tempo's metrics_generator emits span-metrics exemplars via its own
      # remote_write to Prometheus; the OTel Collector's prometheusremotewrite
      # exporter forwards exemplars on incoming OTLP histograms when the source
      # provides them. The exemplar label produced by Tempo is `traceID` (not
      # `trace_id`), so we list both names — Grafana matches whichever is
      # present on the exemplar.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
        - name: trace_id
          datasourceUid: tempo
