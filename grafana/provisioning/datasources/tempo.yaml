# Tempo datasource. Stage A enabled Service Map / Traces-to-Metrics. Stage C
# adds Traces-to-Logs (tracesToLogsV2) so clicking a span in Explore offers
# a "Logs for this span" button that pivots into Loki, filtered to the
# matching service + the trace id.
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: true
    jsonData:
      serviceMap:
        datasourceUid: prometheus

      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags:
          - { key: 'service.name', value: 'service' }
        queries:
          - name: 'Request rate (span-metrics)'
            query: 'sum by (service) (rate(traces_spanmetrics_calls_total{$$__tags}[$$__rate_interval]))'
          - name: 'Error rate (span-metrics)'
            query: 'sum by (service) (rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[$$__rate_interval]))'
          - name: 'p99 latency (span-metrics)'
            query: 'histogram_quantile(0.99, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{$$__tags}[$$__rate_interval])))'

      # Stage C: jump trace -> logs.
      # filterByTraceID=true makes Grafana add a `|= "<traceId>"` filter to
      # the generated LogQL query. tags maps span attribute service.name to
      # the Loki label `service`.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - { key: 'service.name', value: 'service' }

      nodeGraph:
        enabled: true

      search:
        hide: false
