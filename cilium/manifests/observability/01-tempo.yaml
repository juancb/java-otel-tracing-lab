apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
spec:
  type: NodePort
  selector: { app: tempo }
  ports:
    - { name: http,     port: 3200, targetPort: 3200, nodePort: 30200 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: observability
spec:
  serviceName: tempo
  replicas: 1
  selector: { matchLabels: { app: tempo } }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args: [ "-config.file=/etc/tempo/tempo.yaml" ]
          ports:
            - { name: http,      containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data,   mountPath: /var/tempo }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
