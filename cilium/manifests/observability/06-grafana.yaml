apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED,    value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE,   value: "Editor" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM,   value: "true" }
            - { name: GF_FEATURE_TOGGLES_ENABLE,    value: "traceqlEditor" }
          ports: [ { name: http, containerPort: 3000 } ]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboards-cfg, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboards-cfg
          configMap: { name: grafana-dashboards-cfg }
        - name: dashboards
          configMap: { name: grafana-dashboards }
