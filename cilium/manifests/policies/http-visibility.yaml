# K-3: HTTP L7 visibility on Jetty UIs + L4 allows for RPC and JMX ports.
#
# Each policy enables the Envoy HTTP filter on the Jetty UI port so Hubble
# shows URL paths and status codes.  All other ports needed for normal
# operation (HDFS/HBase RPC, JMX scraping) are added as L4 allows to avoid
# Cilium's implicit deny blocking them.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: http-namenode
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app: namenode
  ingress:
    # L7 HTTP: Jetty UI (healthchecks, JMX HTTP endpoint, DataNode readiness probe)
    - toPorts:
        - ports:
            - { port: "9870", protocol: TCP }
          rules:
            http:
              - {}
    # L4: HDFS RPC — DataNode, HBase RegionServer, and clients connect here
    - toPorts:
        - ports:
            - { port: "8020", protocol: TCP }
    # L4: JMX exporter — Prometheus scraping
    - fromEndpoints:
        - matchLabels:
            app: prometheus
            "k8s:io.kubernetes.pod.namespace": observability
      toPorts:
        - ports:
            - { port: "7074", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: http-hbase-master
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app: hbase-master
  ingress:
    # L7 HTTP: HBase Master Jetty UI
    - toPorts:
        - ports:
            - { port: "16010", protocol: TCP }
          rules:
            http:
              - {}
    # L4: HBase Master RPC (RegionServers connect here)
    - toPorts:
        - ports:
            - { port: "16000", protocol: TCP }
    # L4: JMX exporter
    - fromEndpoints:
        - matchLabels:
            app: prometheus
            "k8s:io.kubernetes.pod.namespace": observability
      toPorts:
        - ports:
            - { port: "7072", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: http-hbase-regionserver
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app: hbase-regionserver
  ingress:
    # L7 HTTP: RegionServer Jetty UI
    - toPorts:
        - ports:
            - { port: "16030", protocol: TCP }
          rules:
            http:
              - {}
    # L4: RegionServer RPC (consumer, query-client, HBase Master connect here)
    - toPorts:
        - ports:
            - { port: "16020", protocol: TCP }
    # L4: JMX exporter
    - fromEndpoints:
        - matchLabels:
            app: prometheus
            "k8s:io.kubernetes.pod.namespace": observability
      toPorts:
        - ports:
            - { port: "7073", protocol: TCP }
