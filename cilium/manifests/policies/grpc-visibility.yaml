# K-3: gRPC L7 visibility on the OTel Collector OTLP receiver + L4 for other ports.
#
# All JVM containers send OTLP over plaintext gRPC to otel-collector:4317.
# This policy routes that traffic through Envoy so Hubble shows the gRPC
# service name and method (TraceService/Export, etc.).
# Ports 4318 (HTTP OTLP) and 13133 (health check) are added as L4 allows.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grpc-otlp-visibility
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app: otel-collector
  ingress:
    # L7 gRPC: OTLP trace/metric/log export from all data-plane pods
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": data
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
          rules:
            http:
              - method: POST
                path: /opentelemetry.proto.collector.trace.v1.TraceService/Export
              - method: POST
                path: /opentelemetry.proto.collector.metrics.v1.MetricsService/Export
              - method: POST
                path: /opentelemetry.proto.collector.logs.v1.LogsService/Export
    # L4: HTTP OTLP and health-check ports
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": data
      toPorts:
        - ports:
            - { port: "4318", protocol: TCP }
            - { port: "13133", protocol: TCP }
