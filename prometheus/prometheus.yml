# Prometheus config for the OTel lab.
#
# Sources of metrics:
#   1. remote_write from Tempo (service-graph + span-metrics)
#   2. remote_write from the OTel Collector (OTel-agent JVM metrics)
#   3. Stage B: direct scrape of jmx_prometheus_javaagent endpoints on the
#      Hadoop / HBase / Kafka JVMs

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local-otel-lab

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  # --- Stage B: jmx_prometheus_javaagent endpoints ------------------------
  - job_name: kafka
    metrics_path: /metrics
    static_configs:
      - targets: [ 'kafka:7071' ]
        labels:
          service: kafka
  - job_name: hbase-master
    static_configs:
      - targets: [ 'hbase-master:7072' ]
        labels:
          service: hbase-master
  - job_name: hbase-regionserver
    static_configs:
      - targets: [ 'hbase-regionserver:7073' ]
        labels:
          service: hbase-regionserver
  - job_name: hadoop-namenode
    static_configs:
      - targets: [ 'namenode:7074' ]
        labels:
          service: hadoop-namenode
  - job_name: hadoop-datanode
    static_configs:
      - targets: [ 'datanode:7075' ]
        labels:
          service: hadoop-datanode

  # --- Container USE metrics (cAdvisor) ------------------------------------
  # Per-container CPU / memory / network / disk IO + PSI pressure stalls.
  # cAdvisor sees every container on the Docker host; keep only this
  # compose project's, and expose the compose service name as `service`
  # (compose names: namenode, datanode, kafka, hbase-regionserver, ...).
  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: [ 'cadvisor:8080' ]
    metric_relabel_configs:
      # Keep machine_* (cores, memory: the utilization denominators) and
      # this project's containers; drop other projects and raw cgroups.
      - source_labels: [ __name__, container_label_com_docker_compose_project ]
        regex: 'machine_.*;.*|.*;otel-lab'
        action: keep
      - source_labels: [ container_label_com_docker_compose_service ]
        target_label: service
      - regex: container_label_com_docker_compose_(project|service)
        action: labeldrop
